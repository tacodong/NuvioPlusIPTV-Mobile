name: Build Test App (steps)

# Builds "Nuvio + IPTV Test" (its own app, installs next to the real one) and sends the APK to the
# private test repo (homelessbrian/Nuvio_Testing) as a release named mobile-test-<number>.
# Nothing is kept here and nothing is public. Started by "Build Test App".
#
# Secrets needed: LIVETV_TESTER_KEY (the tester key, built into the test app so it can update itself), TEST_BUILDS_PUBLISH_TOKEN (a token that can write to Nuvio_Testing: Contents read and write),
# the signing key secrets (made by "Create Signing Key") and the app keys (same names as the TV repo).
# Test builds older than a week are deleted (the newest one is always kept).
# The steps behind "Build Test App". They always run from the dev branch, whichever branch the
# Run workflow button is on, so a change here takes effect as soon as it is on dev.
on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: dev
        type: string
      notes:
        description: "What changed (blank = TEST_NOTES.md, or the last commit's title if that's empty)"
        required: false
        type: string

# Write is only used to take the lines that went into a test build out of TEST_NOTES.md.
permissions:
  contents: write

env:
  TEST_REPO: homelessbrian/Nuvio_Testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the test repo is private
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
          KEYSTORE: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the TEST_BUILDS_PUBLISH_TOKEN secret first."; exit 1; }
          [ -n "$KEYSTORE" ] || { echo "::error::Run 'Create Signing Key' first."; exit 1; }
          private=$(gh api "repos/$TEST_REPO" --jq '.private' 2>/dev/null || echo "unknown")
          if [ "$private" != "true" ]; then
            echo "::error::$TEST_REPO must be private (it is: $private). Nothing was built or sent."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        uses: ./.github/actions/app-keys
        with:
          backend_url: ${{ secrets.NUVIO_BACKEND_URL }}
          backend_key: ${{ secrets.NUVIO_BACKEND_KEY }}
          tmdb_api_key: ${{ secrets.TMDB_API_KEY }}
          trakt_client_id: ${{ secrets.TRAKT_CLIENT_ID }}
          trakt_client_secret: ${{ secrets.TRAKT_CLIENT_SECRET }}
          simkl_client_id: ${{ secrets.SIMKL_CLIENT_ID }}
          simkl_app_name: ${{ secrets.SIMKL_APP_NAME }}
          mdblist_client_id: ${{ secrets.MDBLIST_CLIENT_ID }}
          google_drive_client_id: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          google_drive_client_secret: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          premiumize_client_id: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          imdb_ratings_api_base_url: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          imdb_tapframe_api_base_url: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          introdb_api_url: ${{ secrets.INTRODB_API_URL }}

      - name: Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - name: Work out the version
        id: ver
        run: |
          BASE=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -1)
          MINUTES=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "name=${BASE%-beta}-test.$MINUTES" >> "$GITHUB_OUTPUT"
          echo "code=$MINUTES" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          LIVETV_TESTER_KEY: ${{ secrets.LIVETV_TESTER_KEY }}
          # The app key for cloud sync and the sports files (same as APP_KEY in the Worker).
          LIVETV_APP_KEY: ${{ secrets.LIVETV_APP_KEY }}
        run: |
          [ -n "$LIVETV_TESTER_KEY" ] || { echo "::error::Add the LIVETV_TESTER_KEY secret first (the same key the TV repo uses)."; exit 1; }
          chmod +x gradlew
          # Fit the build into the runner's memory (the project's own settings ask for 12 GB + 8 GB).
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/; s/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx5120M/' gradle.properties
          echo 'org.gradle.workers.max=3' >> gradle.properties
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.testBuild=true \
            -Pnuvio.app.versionName="$NAME" -Pnuvio.app.versionCode="$CODE" --stacktrace

      - name: Package OpenVPN 2 corresponding source
        run: |
          python3 vpn-android/ci/package-openvpn2-sources.py --output out/openvpn2-corresponding-source.tar.gz

      - name: Send to the test repo
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
          NOTES: ${{ inputs.notes }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          dir=androidApp/build/outputs/apk/full/release
          ls -la "$dir"
          apk=$(ls "$dir"/*arm64-v8a*.apk 2>/dev/null | head -n 1 || true)
          [ -n "$apk" ] || apk=$(ls "$dir"/*.apk | head -n 1)
          mkdir -p out && cp "$apk" "out/Nuvio-IPTV-Mobile-Test-$CODE.apk"
          # The notes: what's typed in the box, or else TEST_NOTES.md (what's changed since the last
          # test build), or else the last commit's title.
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > out/test-notes.md
            echo "Using the notes typed in the box."
          elif [ -f TEST_NOTES.md ] && python3 .github/test-notes.py build TEST_NOTES.md out/test-notes.md; then
            touch out/used-test-notes
            echo "Using TEST_NOTES.md."
          else
            git log -1 --format=%s > out/test-notes.md
            echo "TEST_NOTES.md has nothing listed: using the last commit's title."
          fi
          cat out/test-notes.md
          gh release create "mobile-test-$CODE" "out/Nuvio-IPTV-Mobile-Test-$CODE.apk" "out/openvpn2-corresponding-source.tar.gz" -R "$TEST_REPO" \
            --title "Mobile $NAME" --notes-file out/test-notes.md --prerelease
          echo "::notice title=Test build ready::$NAME was sent to the test repo."

      # Takes the lines this build used out of TEST_NOTES.md on the branch it was built from, so
      # the next test build only lists what's new since. Anything added while this build ran stays.
      - name: Clear the used test notes
        if: hashFiles('out/used-test-notes') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" notes-repo
          cd notes-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            python3 ../.github/test-notes.py clear TEST_NOTES.md ../out/test-notes.md
            if git diff --quiet -- TEST_NOTES.md; then echo "Nothing to clear."; exit 0; fi
            git commit -q -m "Test notes: cleared what went into test build $NAME" -- TEST_NOTES.md
            if git push -q origin "HEAD:$BRANCH"; then echo "TEST_NOTES.md cleared."; exit 0; fi
            git fetch -q --depth 1 origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
          done
          echo "::warning::Couldn't clear TEST_NOTES.md on $BRANCH; take out the lines that went into $NAME by hand."

      - name: Delete test builds older than a week
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Newest first (by the build number in the tag); the newest one is always kept.
          # Age comes from when the build was published: GitHub's "created_at" is the date of the
          # test repo's own last commit, the same for every build, so it can't be used here.
          gh api "repos/$TEST_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | test("^mobile-test-[0-9]+$"))] | sort_by(.tag_name | ltrimstr("mobile-test-") | tonumber) | reverse | .[1:][] | select((.published_at // .created_at) < "'"$cutoff"'") | .tag_name' \
            | while read -r old; do
                gh release delete "$old" -R "$TEST_REPO" --yes --cleanup-tag || true
              done
